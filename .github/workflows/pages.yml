# Deploys site/ (the public landing page) to Cloudflare Pages: https://tryfrankenstein.pages.dev
# Needs repo secrets CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit) and CLOUDFLARE_ACCOUNT_ID.
# Without the token the job skips cleanly with a notice instead of failing.
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check for Cloudflare credentials
        id: guard
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::notice title=Site deploy skipped::Add the CLOUDFLARE_API_TOKEN repo secret (Cloudflare Pages: Edit) to deploy site/ automatically."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out
        if: steps.guard.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Deploy to Cloudflare Pages
        if: steps.guard.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.158.0"
          command: pages deploy site --project-name=tryfrankenstein --branch=main --commit-dirty=true

      - name: Smoke test
        if: steps.guard.outputs.ready == 'true'
        run: |
          site=https://tryfrankenstein.pages.dev
          for p in / /judges /about /contact /privacy /llms.txt /robots.txt /sitemap.xml /index.md; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$site$p")
            echo "$p -> $code"
            [ "$code" = "200" ] || exit 1
          done
          # Markdown content negotiation: Markdown with Vary: Accept for agents, HTML for browsers.
          h=$(curl -sS -L -D - -o /dev/null -H 'Accept: text/markdown' "$site/")
          echo "$h" | grep -qi '^content-type: text/markdown' || { echo "home: no Markdown"; exit 1; }
          echo "$h" | grep -qi '^vary:.*accept' || { echo "home: no Vary: Accept"; exit 1; }
          curl -sS -L -D - -o /dev/null -H 'Accept: text/html' "$site/" | grep -qi '^content-type: text/html' || { echo "home: no HTML"; exit 1; }
          # Agent-friendly 404: status 404 and a Markdown body that links to llms.txt.
          probe="$site/__smoke-404-$GITHUB_RUN_ID"
          code=$(curl -sS -L -o /tmp/404.md -w "%{http_code} %{content_type}" -H 'Accept: text/markdown' "$probe")
          echo "404 probe -> $code"
          case "$code" in "404 text/markdown"*) ;; *) exit 1 ;; esac
          grep -q 'llms.txt' /tmp/404.md || { echo "404 body has no llms.txt link"; exit 1; }
