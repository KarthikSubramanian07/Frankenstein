# Deploys site/ (the public landing page) to Cloudflare Pages: https://tryfrankenstein.pages.dev
# Needs repo secrets CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit) and CLOUDFLARE_ACCOUNT_ID.
# Without the token the job skips cleanly with a notice instead of failing.
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check for Cloudflare credentials
        id: guard
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::notice title=Site deploy skipped::Add the CLOUDFLARE_API_TOKEN repo secret (Cloudflare Pages: Edit) to deploy site/ automatically."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out
        if: steps.guard.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Deploy to Cloudflare Pages
        if: steps.guard.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.158.0"
          command: pages deploy site --project-name=tryfrankenstein --branch=main --commit-dirty=true

      - name: Smoke test
        if: steps.guard.outputs.ready == 'true'
        run: |
          for p in / /robots.txt /sitemap.xml; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://tryfrankenstein.pages.dev$p")
            echo "$p -> $code"
            [ "$code" = "200" ] || exit 1
          done
