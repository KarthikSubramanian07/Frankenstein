<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="t d"><title id="t">Play to recover</title><desc id="d">A loop of five steps. You play. SubQ Snap picks the function on screen. The crew (Muse) recovers it. The Lab rebuilds the ROM with the same SHA-1. The region heals on screen, and you keep playing.</desc><style>.s{font-family:Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', SFMono-Regular, ui-monospace, Menlo, Consolas, monospace}</style>
