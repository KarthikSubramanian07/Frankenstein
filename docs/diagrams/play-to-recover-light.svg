<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="668" viewBox="0 0 1200 668" role="img" aria-labelledby="t d"><title id="t">Play to recover</title><desc id="d">A loop. A player plays on the controller. The tap samples the running functions and frames. SubQ Snap's director picks the next function from what is on screen. The crew recovers it and the Checker proves it. The Lab rebuilds the ROM with an identical SHA-1. The rebuilt ROM is hot-swapped into the running game, and that region of the screen heals, back in front of the player.</desc><style>.s{font-family:'Inter Tight', Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', SFMono-Regular, ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace}.f{font-family:Fraunces, Georgia, 'Times New Roman', serif}</style><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#17141F" stroke-opacity="0.05" stroke-width="1"/></pattern><radialGradient id="f" cx="50%" cy="38%" r="62%"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><mask id="m"><rect width="1200" height="668" fill="url(#f)"/></mask></defs>
<rect x="0" y="0" width="1200" height="668" rx="24" fill="#F4F0E6"/>
<rect width="1200" height="668" rx="24" fill="url(#g)" mask="url(#m)"/>
<text x="48" y="60" class="m" font-size="12" font-weight="600" letter-spacing="1.4" fill="#4A4556">PLAY TO RECOVER</text>
<text x="48" y="98" class="f" font-size="30" font-weight="600" letter-spacing="-0.4" fill="#17141F">The game tells the crew where to dig.</text>
