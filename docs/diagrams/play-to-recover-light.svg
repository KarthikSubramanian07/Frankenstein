<rect x="630" y="532" width="200" height="92" rx="16" fill="#FBF9F3" stroke="#CFC6B2" stroke-width="1"/>
<text x="646" y="558" class="m" font-size="12" font-weight="600" letter-spacing="1.2" fill="#6E6878">06 · CREATURE</text>
<text x="646" y="584" class="s" font-size="16" font-weight="600" fill="#17141F">Hot-swap, live</text>
<text x="646" y="606" class="m" font-size="12" fill="#6E6878">rom.swapped</text>
<rect x="370" y="532" width="200" height="92" rx="16" fill="#FBF9F3" stroke="#CFC6B2" stroke-width="1"/>
<text x="386" y="558" class="m" font-size="12" font-weight="600" letter-spacing="1.2" fill="#6E6878">07 · CREATURE</text>
<text x="386" y="584" class="s" font-size="16" font-weight="600" fill="#17141F">The region heals</text>
<text x="386" y="606" class="m" font-size="12" fill="#6E6878">static → pixels</text>
<text x="600" y="382" class="f" font-size="32" font-weight="600" text-anchor="middle" letter-spacing="-0.4" fill="#17141F">Play it, and we rebuild it.</text>
<text x="600" y="414" class="s" font-size="15" text-anchor="middle" fill="#4A4556">Snap watches what's on screen and sends the crew there.</text>
<text x="600" y="436" class="s" font-size="15" text-anchor="middle" fill="#4A4556">Every swap is byte-identical, or it doesn't ship.</text>
