<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="432" viewBox="0 0 1200 432" role="img" aria-labelledby="t d"><title id="t">Frankenstein system</title><desc id="d">Someone asks in ASI:One. The Lab (referee, port 7101) hands the job to the Crew (port 7111), and the Crew asks the Lab to check every attempt. The Lab and the Crew write to one append-only event stream, events.jsonl. The Stage (port 7202) reads it to run the show, and the Creature (port 7401) reads it to heal the game and writes back when it swaps the ROM.</desc><style>.s{font-family:Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', SFMono-Regular, ui-monospace, Menlo, Consolas, monospace}</style>
