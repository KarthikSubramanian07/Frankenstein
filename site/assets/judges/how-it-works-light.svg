<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="290" viewBox="24 36 1152 290" role="img" aria-labelledby="t d"><title id="t">How Frankenstein works</title><desc id="d">The compiled game goes to a Digger (Muse), which writes C. The Referee compiles it, and the Checker re-runs the claim. Rejected work goes back to the Digger. Accepted work becomes a rebuilt ROM with the same SHA-1. SubQ Snap steers the loop, and every match adds habits to MongoDB for the next attempt.</desc><style>.s{font-family:Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.m{font-family:'JetBrains Mono', SFMono-Regular, ui-monospace, Menlo, Consolas, monospace}</style>
