<text x="360" y="150" class="s" font-size="13" text-anchor="middle" fill="#17141F" fill-opacity="0.6">Muse</text>
<rect x="520.5" y="104.5" width="159" height="63" rx="8" fill="none" stroke="#17141F" stroke-opacity="0.32" stroke-width="1"/>
<text x="600" y="132" class="s" font-size="15" font-weight="500" text-anchor="middle" fill="#17141F">Referee</text>
