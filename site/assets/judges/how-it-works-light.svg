<text x="840" y="132" class="s" font-size="15" font-weight="500" text-anchor="middle" fill="#17141F">Checker</text>
<text x="840" y="150" class="s" font-size="13" text-anchor="middle" fill="#17141F" fill-opacity="0.6">re-runs claims</text>
