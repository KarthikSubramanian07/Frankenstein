<text x="120" y="132" class="s" font-size="15" font-weight="500" text-anchor="middle" fill="#17141F">Compiled game</text>
<text x="120" y="150" class="s" font-size="13" text-anchor="middle" fill="#17141F" fill-opacity="0.6">source lost</text>
